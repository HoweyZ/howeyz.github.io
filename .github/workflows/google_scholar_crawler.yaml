name: Get Citation Data

on:
  schedule:
    - cron:  '27 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run
      run: |
        cd ./google_scholar_crawler
        python3 -m venv .venv
        .venv/bin/pip install --quiet -r requirements.txt
        .venv/bin/python main.py
      env:
        GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
    - name: Commit and Push
      run: |
        cp google_scholar_crawler/results/gs_data.json google-scholar-stats/gs_data.json
        cp google_scholar_crawler/results/gs_data_shieldsio.json google-scholar-stats/gs_data_shieldsio.json
        git config --local user.name "github-actions[bot]"
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git add google-scholar-stats/*.json
        git diff --cached --quiet || git commit -m "Updated Citation Data"
        git pull --rebase origin main
        git push origin main
