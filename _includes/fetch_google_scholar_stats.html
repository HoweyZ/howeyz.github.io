<script>
    $(document).ready(function () {
        // Cache-bust daily so the badge reflects the weekly crawler update
        var v = new Date().toISOString().slice(0, 10);
        $.getJSON("{{ site.baseurl }}/google-scholar-stats/gs_data.json?v=" + v, function (data) {
            var el = document.getElementById('total_cit');
            if (el) {
                el.innerHTML = data['citedby'];
            }
        });
    })
</script>
